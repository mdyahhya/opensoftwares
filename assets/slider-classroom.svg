<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <defs>
    <filter id="shadowClass" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0A2A5E" flood-opacity="0.08" />
    </filter>
    <linearGradient id="videoThumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Card Background: Exact Website Background (#F6F4EF) -->
  <rect width="600" height="600" rx="20" fill="#F6F4EF" />
  <rect x="1" y="1" width="598" height="598" rx="19" stroke="#E5E0D8" stroke-width="1.5" />
  <path d="M0 20 C0 9 9 0 20 0 L580 0 C591 0 600 9 600 20 L600 6 L0 6 Z" fill="#0284C7" />

  <!-- Header -->
  <g transform="translate(36, 32)">
    <rect width="190" height="26" rx="13" fill="#E0F2FE" stroke="#BAE6FD" />
    <circle cx="15" cy="13" r="4" fill="#0284C7" />
    <text x="26" y="17" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#0369A1" letter-spacing="0.6">VIDEO LECTURES &amp; LMS</text>

    <text x="0" y="60" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="26" fill="#0B1630">Future-Ready Video Learning</text>
    <text x="0" y="86" font-family="'Inter', -apple-system, sans-serif" font-weight="400" font-size="13.5" fill="#64748B">Curated CBSE video lessons, digital gradebooks &amp; smart timetables</text>
  </g>

  <!-- Video Learning Interface Mockup Container -->
  <g transform="translate(36, 146)" filter="url(#shadowClass)">
    <rect width="528" height="412" rx="16" fill="#FAF9F6" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Video Player Window -->
    <g transform="translate(20, 18)">
      <rect width="488" height="194" rx="12" fill="url(#videoThumbGrad)" />
      
      <!-- Math Equations Pattern on Chalkboard -->
      <g opacity="0.4" stroke="#FFFFFF" stroke-width="1.2">
        <text x="28" y="42" font-family="'Courier New', monospace" font-size="14" fill="#FFFFFF">f(x) = ax&#178; + bx + c = 0</text>
        <text x="28" y="72" font-family="'Courier New', monospace" font-size="13.5" fill="#FFFFFF">x = (-b &#177; &#8730;(b&#178; - 4ac)) / 2a</text>
        <text x="28" y="102" font-family="'Courier New', monospace" font-size="13" fill="#FFFFFF">Discriminant D = b&#178; - 4ac &gt; 0</text>
      </g>

      <!-- Center Play Button with Glow -->
      <circle cx="244" cy="97" r="30" fill="rgba(255,255,255,0.95)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.35))" />
      <polygon points="238,85 256,97 238,109" fill="#0A2A5E" />

      <!-- Video Duration Tag -->
      <rect x="16" y="156" width="130" height="22" rx="4" fill="rgba(0,0,0,0.65)" />
      <text x="24" y="171" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">CBSE Class X &#8226; 18:42</text>

      <!-- Video Progress Bar -->
      <rect x="0" y="188" width="488" height="6" fill="rgba(255,255,255,0.2)" />
      <rect x="0" y="188" width="320" height="6" fill="#E8A317" />
    </g>

    <!-- Currently Playing Info -->
    <g transform="translate(20, 230)">
      <rect width="96" height="22" rx="4" fill="#E0F2FE" />
      <text x="48" y="15" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#0369A1" text-anchor="middle">MATHEMATICS</text>
      <text x="108" y="16" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700" fill="#0B1630">Chapter 7: Quadratic Equations &#8226; Roots &amp; Graph</text>
      
      <!-- Teacher info and Vector Star -->
      <g transform="translate(0, 36)">
        <text x="0" y="0" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#64748B">Prof. Ananya Sen &#8226; 4,280 student views &#8226; Rated 4.9</text>
        <!-- Vector Star -->
        <polygon points="280,-8 282,-3 287,-3 283,0 285,5 280,2 275,5 277,0 273,-3 278,-3" fill="#E8A317" />
      </g>
    </g>

    <!-- Next Up Video List -->
    <g transform="translate(20, 290)">
      <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#64748B">NEXT LESSONS IN THIS CHAPTER</text>
      
      <!-- Video Item 2 -->
      <g transform="translate(0, 22)">
        <rect width="488" height="46" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
        <rect x="8" y="7" width="48" height="32" rx="4" fill="#0F172A" />
        <polygon points="30,19 38,23 30,27" fill="#FFFFFF" />
        <text x="68" y="22" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#0B1630">Nature of Roots &amp; Word Problems</text>
        <text x="68" y="36" font-family="'Inter', sans-serif" font-size="9.5" fill="#64748B">Duration: 22:15 &#8226; Includes 5 Practice Quizzes</text>
        <rect x="414" y="11" width="66" height="24" rx="4" fill="#F1F5F9" />
        <text x="447" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0A2A5E" text-anchor="middle">Play Next</text>
      </g>
    </g>
  </g>
</svg>
