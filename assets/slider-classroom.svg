<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <defs>
    <filter id="shadowClass" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0A2A5E" flood-opacity="0.08" />
    </filter>
    <linearGradient id="videoThumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Clean White Card Background -->
  <rect width="600" height="600" rx="24" fill="#FFFFFF" />
  <rect x="1" y="1" width="598" height="598" rx="23" stroke="#E2E8F0" stroke-width="2" />
  <path d="M0 24 C0 10.7 10.7 0 24 0 L576 0 C589.3 0 600 10.7 600 24 L600 6 L0 6 Z" fill="#0284C7" />

  <!-- Header -->
  <g transform="translate(40, 36)">
    <rect width="200" height="28" rx="14" fill="#E0F2FE" stroke="#BAE6FD" />
    <circle cx="16" cy="14" r="4" fill="#0284C7" />
    <text x="28" y="18" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#0369A1" letter-spacing="0.6">VIDEO LECTURES &amp; LMS</text>

    <text x="0" y="66" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#0B1630">Future-Ready Video Learning</text>
    <text x="0" y="96" font-family="'Inter', sans-serif" font-weight="400" font-size="14" fill="#64748B">Curated CBSE video lessons, digital gradebooks &amp; smart timetables</text>
  </g>

  <!-- Video Learning Interface Mockup -->
  <g transform="translate(40, 160)" filter="url(#shadowClass)">
    <rect width="520" height="390" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Video Player Window -->
    <g transform="translate(24, 20)">
      <rect width="472" height="190" rx="12" fill="url(#videoThumbGrad)" />
      
      <!-- Math Equations Pattern on Chalkboard -->
      <g opacity="0.35" stroke="#FFFFFF" stroke-width="1.5">
        <text x="30" y="45" font-family="'Courier New', monospace" font-size="15" fill="#FFFFFF">f(x) = ax² + bx + c = 0</text>
        <text x="30" y="75" font-family="'Courier New', monospace" font-size="14" fill="#FFFFFF">x = (-b ± √(b² - 4ac)) / 2a</text>
        <text x="30" y="105" font-family="'Courier New', monospace" font-size="13" fill="#FFFFFF">Discriminant Δ = b² - 4ac &gt; 0</text>
      </g>

      <!-- Center Play Button with Glow -->
      <circle cx="236" cy="95" r="32" fill="rgba(255,255,255,0.95)" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.4))" />
      <polygon points="230,82 248,95 230,108" fill="#0A2A5E" />

      <!-- Video Duration Tag -->
      <rect x="16" y="152" width="130" height="22" rx="4" fill="rgba(0,0,0,0.65)" />
      <text x="24" y="167" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">CBSE Class X &bull; 18:42</text>

      <!-- Video Progress Bar -->
      <rect x="0" y="184" width="472" height="6" fill="rgba(255,255,255,0.2)" />
      <rect x="0" y="184" width="310" height="6" fill="#E8A317" />
    </g>

    <!-- Currently Playing Info -->
    <g transform="translate(24, 226)">
      <rect width="90" height="20" rx="4" fill="#E0F2FE" />
      <text x="45" y="14" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#0369A1" text-anchor="middle">MATHEMATICS</text>
      <text x="100" y="15" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0B1630">Chapter 7: Quadratic Equations &bull; Roots &amp; Graph</text>
      <text x="0" y="36" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#64748B">Prof. Ananya Sen &bull; 4,280 student views &bull; Rated 4.9 ★</text>
    </g>

    <!-- Next Up Video List -->
    <g transform="translate(24, 280)">
      <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#64748B">NEXT LESSONS IN THIS CHAPTER</text>
      
      <!-- Video Item 2 -->
      <g transform="translate(0, 22)">
        <rect width="472" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
        <rect x="6" y="6" width="45" height="30" rx="4" fill="#0F172A" />
        <polygon points="26,17 33,21 26,25" fill="#FFFFFF" />
        <text x="60" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0B1630">Nature of Roots &amp; Word Problems</text>
        <text x="60" y="34" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Duration: 22:15 &bull; Includes 5 Practice Quizzes</text>
        <rect x="400" y="10" width="60" height="22" rx="4" fill="#F1F5F9" />
        <text x="430" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0A2A5E" text-anchor="middle">Play Next</text>
      </g>
    </g>
  </g>
</svg>
