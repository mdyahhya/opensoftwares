<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" rx="24" fill="url(#bgGrad2)" />
  <circle cx="100" cy="80" r="240" fill="#3B82F6" opacity="0.12" />
  <circle cx="1050" cy="480" r="280" fill="#60A5FA" opacity="0.1" />

  <!-- Left Content -->
  <g transform="translate(80, 110)">
    <rect width="210" height="36" rx="18" fill="#1E40AF" opacity="0.8" />
    <circle cx="20" cy="18" r="6" fill="#38BDF8" />
    <text x="36" y="23" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#E0E7FF" letter-spacing="0.5">ANDROID PARENT APP</text>

    <text x="0" y="85" font-family="'Inter', sans-serif" font-weight="800" font-size="44" fill="#FFFFFF">Empowering Parents</text>
    <text x="0" y="140" font-family="'Inter', sans-serif" font-weight="800" font-size="44" fill="#38BDF8">Every Single Day</text>

    <text x="0" y="188" font-family="'Inter', sans-serif" font-weight="400" font-size="17" fill="#CBD5E1">Instant homework notifications, exam grade sheets, direct chat</text>
    <text x="0" y="214" font-family="'Inter', sans-serif" font-weight="400" font-size="17" fill="#CBD5E1">with teachers, and one-tap UPI fee receipts on their smartphones.</text>

    <g transform="translate(0, 260)">
      <rect width="150" height="38" rx="8" fill="#0F2856" />
      <text x="18" y="24" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#FFFFFF">📱 Native Android</text>

      <rect x="165" width="165" height="38" rx="8" fill="#0F2856" />
      <text x="183" y="24" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#FFFFFF">💬 Parent-Teacher Chat</text>

      <rect x="345" width="145" height="38" rx="8" fill="#0F2856" />
      <text x="363" y="24" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#FFFFFF">💳 Instant UPI Fees</text>
    </g>
  </g>

  <!-- Right Visual: Two overlapping sleek mobile screens -->
  <g transform="translate(680, 50)" filter="url(#phoneShadow)">
    <!-- Back Phone (Teacher view / Notices) -->
    <g transform="translate(180, 40) rotate(6)">
      <rect width="250" height="470" rx="36" fill="#1E293B" stroke="#334155" stroke-width="4" />
      <!-- Screen -->
      <rect x="10" y="10" width="230" height="450" rx="28" fill="#FFFFFF" />
      <!-- App Header -->
      <rect x="10" y="10" width="230" height="60" rx="28" fill="#0A2A5E" />
      <rect x="10" y="45" width="230" height="25" fill="#0A2A5E" />
      <text x="30" y="48" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">Digital Notice Board</text>
      <!-- Notice cards -->
      <rect x="25" y="85" width="200" height="65" rx="8" fill="#EFF6FF" stroke="#BFDBFE" />
      <text x="35" y="105" font-family="'Inter', sans-serif" font-size="11" fill="#1E40AF" font-weight="700">Annual Sports Meet 2026</text>
      <text x="35" y="122" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Schedule and jersey distribution...</text>

      <rect x="25" y="160" width="200" height="65" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="35" y="180" font-family="'Inter', sans-serif" font-size="11" fill="#0F172A" font-weight="700">Parent-Teacher Meeting</text>
      <text x="35" y="197" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Saturday, 10:00 AM in Room 12</text>
    </g>

    <!-- Front Main Phone -->
    <g transform="translate(20, 20)">
      <rect width="260" height="490" rx="36" fill="#0A2A5E" stroke="#1E40AF" stroke-width="4" />
      <!-- Screen Inner -->
      <rect x="10" y="10" width="240" height="470" rx="28" fill="#F8FAFC" />
      <!-- Camera punch hole -->
      <circle cx="130" cy="24" r="5" fill="#0A2A5E" />

      <!-- App Header -->
      <rect x="10" y="10" width="240" height="70" rx="28" fill="#0A2A5E" />
      <rect x="10" y="55" width="240" height="25" fill="#0A2A5E" />
      <text x="30" y="54" font-family="'Inter', sans-serif" font-size="13" fill="#FFFFFF" font-weight="700">SchoolMate Parent App</text>
      <circle cx="225" cy="50" r="12" fill="#2563EB" />
      <text x="221" y="54" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF" font-weight="700">3</text>

      <!-- Student Card -->
      <rect x="25" y="90" width="210" height="60" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
      <circle cx="55" cy="120" r="18" fill="#3B82F6" />
      <text x="48" y="125" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF" font-weight="700">A</text>
      <text x="85" y="115" font-family="'Inter', sans-serif" font-size="12" fill="#0F172A" font-weight="700">Aditya Deshmukh</text>
      <text x="85" y="132" font-family="'Inter', sans-serif" font-size="10" fill="#10B981" font-weight="600">✓ Present Today (9:05 AM)</text>

      <!-- Feature Badges -->
      <rect x="25" y="160" width="98" height="70" rx="10" fill="#EFF6FF" stroke="#BFDBFE" />
      <text x="35" y="182" font-family="'Inter', sans-serif" font-size="16">📚</text>
      <text x="35" y="202" font-family="'Inter', sans-serif" font-size="11" fill="#1E40AF" font-weight="700">Homework</text>
      <text x="35" y="218" font-family="'Inter', sans-serif" font-size="9" fill="#3B82F6">2 due tomorrow</text>

      <rect x="135" y="160" width="100" height="70" rx="10" fill="#ECFDF5" stroke="#A7F3D0" />
      <text x="145" y="182" font-family="'Inter', sans-serif" font-size="16">💳</text>
      <text x="145" y="202" font-family="'Inter', sans-serif" font-size="11" fill="#065F46" font-weight="700">Term Fee</text>
      <text x="145" y="218" font-family="'Inter', sans-serif" font-size="9" fill="#10B981">Receipt Paid</text>

      <!-- Live Notification Banner -->
      <rect x="25" y="240" width="210" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="40" y="262" font-family="'Inter', sans-serif" font-size="11" fill="#0F172A" font-weight="700">Bus Status • Route 14</text>
      <rect x="40" y="275" width="180" height="6" rx="3" fill="#E2E8F0" />
      <rect x="40" y="275" width="120" height="6" rx="3" fill="#2563EB" />
      <circle cx="160" cy="278" r="6" fill="#F59E0B" />
      <text x="40" y="305" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">Arriving in 6 mins at Sector 4</text>

      <!-- Teacher Feedback snippet -->
      <rect x="25" y="340" width="210" height="75" rx="12" fill="#FEF3C7" stroke="#FDE68A" />
      <text x="38" y="360" font-family="'Inter', sans-serif" font-size="11" fill="#92400E" font-weight="700">Teacher Note (Maths)</text>
      <text x="38" y="378" font-family="'Inter', sans-serif" font-size="9" fill="#78350F">"Excellent score in Geometry unit test. Keep it up!"</text>
      <text x="38" y="398" font-family="'Inter', sans-serif" font-size="8" fill="#B45309">— Mrs. Joshi (Class Teacher)</text>
    </g>
  </g>
</svg>
