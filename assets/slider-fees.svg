        <path d="M9 16 L14 21 L23 11" stroke="#0A2A5E" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="44" y="14" font-family="'Inter', sans-serif" font-size="12" fill="#0F172A" font-weight="700">Sneha Patil — Grade 7A</text>
        <text x="44" y="28" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">Term-2 Tuition Fee • Google Pay UPI</text>
        <text x="330" y="14" font-family="'Inter', sans-serif" font-size="12" fill="#15803D" font-weight="700">₹12,000</text>
        <text x="330" y="28" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">#REC-8903</text>
