<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <defs>
    <filter id="shadowFees" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0A2A5E" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Card Background: Exact Website Background (#F6F4EF) -->
  <rect width="600" height="600" rx="20" fill="#F6F4EF" />
  <rect x="1" y="1" width="598" height="598" rx="19" stroke="#E5E0D8" stroke-width="1.5" />
  <path d="M0 20 C0 9 9 0 20 0 L580 0 C591 0 600 9 600 20 L600 6 L0 6 Z" fill="#10B981" />

  <!-- Header -->
  <g transform="translate(36, 32)">
    <rect width="180" height="26" rx="13" fill="#DCFCE7" stroke="#BBF7D0" />
    <circle cx="15" cy="13" r="4" fill="#10B981" />
    <text x="26" y="17" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#15803D" letter-spacing="0.6">UPI &amp; PHONEPE GATEWAY</text>

    <text x="0" y="60" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="26" fill="#0B1630">Automated Fee Collection</text>
    <text x="0" y="86" font-family="'Inter', -apple-system, sans-serif" font-weight="400" font-size="13.5" fill="#64748B">Instant UPI QR codes, PhonePe integration &amp; digital tax receipts</text>
  </g>

  <!-- Fee Payment & QR Code Mockup Container -->
  <g transform="translate(36, 146)" filter="url(#shadowFees)">
    <rect width="528" height="412" rx="16" fill="#FAF9F6" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Left Box: Dynamic UPI QR Code -->
    <g transform="translate(20, 20)">
      <rect width="220" height="372" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />

      <!-- QR Title -->
      <text x="110" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0B1630" text-anchor="middle">Scan &amp; Pay via UPI</text>
      <text x="110" y="38" font-family="'Inter', sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">Instant Zero-Fee Settlement</text>

      <!-- Accurate Vector QR Code Representation -->
      <g transform="translate(25, 48)">
        <rect width="170" height="170" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
        
        <!-- Top-Left Target -->
        <rect x="12" y="12" width="38" height="38" rx="4" fill="#0B1630" />
        <rect x="18" y="18" width="26" height="26" rx="2" fill="#FFFFFF" />
        <rect x="23" y="23" width="16" height="16" rx="1" fill="#0B1630" />

        <!-- Top-Right Target -->
        <rect x="120" y="12" width="38" height="38" rx="4" fill="#0B1630" />
        <rect x="126" y="18" width="26" height="26" rx="2" fill="#FFFFFF" />
        <rect x="131" y="23" width="16" height="16" rx="1" fill="#0B1630" />

        <!-- Bottom-Left Target -->
        <rect x="12" y="120" width="38" height="38" rx="4" fill="#0B1630" />
        <rect x="18" y="126" width="26" height="26" rx="2" fill="#FFFFFF" />
        <rect x="23" y="131" width="16" height="16" rx="1" fill="#0B1630" />

        <!-- QR Data Matrix Pixels -->
        <g fill="#0B1630">
          <rect x="60" y="14" width="8" height="8" /><rect x="76" y="14" width="8" height="8" /><rect x="94" y="14" width="8" height="8" />
          <rect x="66" y="28" width="8" height="8" /><rect x="84" y="28" width="8" height="8" /><rect x="100" y="28" width="8" height="8" />
          <rect x="14" y="60" width="8" height="8" /><rect x="30" y="66" width="8" height="8" /><rect x="44" y="60" width="8" height="8" />
          <rect x="60" y="60" width="12" height="12" /><rect x="84" y="60" width="8" height="8" /><rect x="104" y="60" width="8" height="8" />
          <rect x="126" y="66" width="8" height="8" /><rect x="142" y="60" width="10" height="10" />
          <rect x="60" y="84" width="8" height="8" /><rect x="74" y="78" width="12" height="12" /><rect x="98" y="84" width="8" height="8" />
          <rect x="114" y="84" width="8" height="8" /><rect x="132" y="78" width="8" height="8" />
          <rect x="14" y="96" width="8" height="8" /><rect x="34" y="96" width="8" height="8" /><rect x="46" y="88" width="8" height="8" />
          <rect x="60" y="106" width="10" height="10" /><rect x="84" y="108" width="8" height="8" /><rect x="104" y="102" width="8" height="8" />
          <rect x="60" y="126" width="8" height="8" /><rect x="76" y="132" width="8" height="8" /><rect x="94" y="126" width="8" height="8" />
          <rect x="66" y="142" width="8" height="8" /><rect x="84" y="144" width="8" height="8" /><rect x="126" y="126" width="8" height="8" />
          <rect x="142" y="142" width="8" height="8" /><rect x="114" y="144" width="8" height="8" />
        </g>

        <!-- Center UPI Emblem Badge -->
        <rect x="71" y="71" width="28" height="28" rx="6" fill="#0A2A5E" />
        <text x="85" y="89" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#E8A317" text-anchor="middle">UPI</text>
      </g>

      <!-- Supported App Badges (PhonePe, GPay, Paytm) -->
      <g transform="translate(14, 234)">
        <!-- PhonePe Badge -->
        <rect width="90" height="28" rx="6" fill="#5F259F" />
        <circle cx="16" cy="14" r="9" fill="#FFFFFF" />
        <text x="16" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#5F259F" text-anchor="middle">&#2346;&#2375;</text>
        <text x="54" y="18" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">PhonePe</text>

        <!-- Google Pay / Paytm Badge -->
        <rect x="98" width="94" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
        <text x="145" y="18" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#1E293B" text-anchor="middle">GPay &#8226; Paytm</text>
      </g>

      <!-- Security Guarantee with Vector Lock Icon -->
      <g transform="translate(14, 282)">
        <rect width="192" height="74" rx="8" fill="#F1F5F9" />
        <!-- Vector Lock Icon -->
        <path d="M26 23 h12 a2 2 0 0 1 2 2 v8 a2 2 0 0 1 -2 2 h-12 a2 2 0 0 1 -2 -2 v-8 a2 2 0 0 1 2 -2 z" fill="#059669" />
        <path d="M29 23 v-4 a3 3 0 0 1 6 0 v4" stroke="#059669" stroke-width="2" fill="none" />
        <text x="108" y="32" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#059669" text-anchor="middle">Bank-Grade 256-bit SSL</text>
        <text x="96" y="52" font-family="'Inter', sans-serif" font-size="8.5" fill="#64748B" text-anchor="middle">Direct Settlement to School Account</text>
      </g>
    </g>

    <!-- Right Box: Instant Digital Fee Receipt -->
    <g transform="translate(256, 20)">
      <rect width="252" height="372" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />

      <!-- Payment Status Header -->
      <g transform="translate(18, 18)">
        <circle cx="20" cy="20" r="18" fill="#DCFCE7" />
        <!-- Vector Checkmark -->
        <path d="M14 20 l4 4 l8 -8" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        
        <text x="48" y="17" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#15803D">PAYMENT RECEIVED</text>
        
        <!-- Official Vector Rupee Symbol followed by Amount -->
        <g transform="translate(48, 25)">
          <!-- Vector Rupee Glyph -->
          <path d="M0 2 h11 v2 H0 z M0 6 h11 v2 H0 z M0 2 v9 c3.5 0 5.8-1.5 5.8-3.8 S3.5 2 0 2 z M3.8 8.8 l6.2 7.2 h3.2 l-6.6-7.6 z" fill="#0B1630" />
          <text x="17" y="14" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#0B1630">18,500.00</text>
        </g>
      </g>

      <line x1="18" y1="76" x2="234" y2="76" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" />

      <!-- Receipt Metadata -->
      <g transform="translate(18, 92)">
        <text x="0" y="10" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748B">STUDENT NAME</text>
        <text x="0" y="27" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0B1630">Aanya Agarwal &#8226; Class X-B</text>

        <text x="0" y="55" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748B">FEE HEAD</text>
        <text x="0" y="72" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0B1630">Term-2 Tuition &amp; Bus Fee</text>

        <text x="0" y="100" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748B">TRANSACTION ID / UPI REF</text>
        <text x="0" y="117" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#0A2A5E">UPI-948210395721</text>

        <text x="0" y="145" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748B">DATE &amp; TIME</text>
        <text x="0" y="162" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#0B1630">22 Oct 2026, 09:14 AM</text>
      </g>

      <!-- 1-Click PDF Download Button with Vector Download Icon -->
      <g transform="translate(18, 304)">
        <rect width="216" height="44" rx="8" fill="#0A2A5E" />
        <!-- Vector Download Icon -->
        <g transform="translate(36, 14)" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M8 2 v10 M4 8 l4 4 l4 -4" />
          <path d="M2 14 h12" />
        </g>
        <text x="122" y="27" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Download Tax Receipt</text>
      </g>
    </g>
  </g>
</svg>
