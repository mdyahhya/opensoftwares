<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <defs>
    <filter id="shadowFees" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0A2A5E" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean White Card Background -->
  <rect width="600" height="600" rx="24" fill="#FFFFFF" />
  <rect x="1" y="1" width="598" height="598" rx="23" stroke="#E2E8F0" stroke-width="2" />
  <path d="M0 24 C0 10.7 10.7 0 24 0 L576 0 C589.3 0 600 10.7 600 24 L600 6 L0 6 Z" fill="#10B981" />

  <!-- Header -->
  <g transform="translate(40, 36)">
    <rect width="180" height="28" rx="14" fill="#DCFCE7" stroke="#BBF7D0" />
    <circle cx="16" cy="14" r="4" fill="#10B981" />
    <text x="28" y="18" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#15803D" letter-spacing="0.6">UPI &amp; PHONEPE GATEWAY</text>

    <text x="0" y="66" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#0B1630">Automated Fee Collection</text>
    <text x="0" y="96" font-family="'Inter', sans-serif" font-weight="400" font-size="14" fill="#64748B">Instant UPI QR codes, PhonePe integration &amp; digital tax receipts</text>
  </g>

  <!-- Fee Payment & QR Code Mockup -->
  <g transform="translate(40, 160)" filter="url(#shadowFees)">
    <rect width="520" height="390" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Left Box: Dynamic UPI QR Code -->
    <g transform="translate(24, 24)">
      <rect width="210" height="342" rx="14" fill="#FFFFFF" stroke="#E2E8F0" />

      <!-- QR Title -->
      <text x="105" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0B1630" text-anchor="middle">Scan &amp; Pay via UPI</text>
      <text x="105" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Zero Transaction Fee</text>

      <!-- Accurate Vector QR Code Representation -->
      <g transform="translate(25, 54)">
        <rect width="160" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
        
        <!-- Top-Left Target -->
        <rect x="12" y="12" width="36" height="36" rx="4" fill="#0B1630" />
        <rect x="18" y="18" width="24" height="24" rx="2" fill="#FFFFFF" />
        <rect x="23" y="23" width="14" height="14" rx="1" fill="#0B1630" />

        <!-- Top-Right Target -->
        <rect x="112" y="12" width="36" height="36" rx="4" fill="#0B1630" />
        <rect x="118" y="18" width="24" height="24" rx="2" fill="#FFFFFF" />
        <rect x="123" y="23" width="14" height="14" rx="1" fill="#0B1630" />

        <!-- Bottom-Left Target -->
        <rect x="12" y="112" width="36" height="36" rx="4" fill="#0B1630" />
        <rect x="18" y="118" width="24" height="24" rx="2" fill="#FFFFFF" />
        <rect x="23" y="123" width="14" height="14" rx="1" fill="#0B1630" />

        <!-- QR Data Matrix Pixels -->
        <g fill="#0B1630">
          <rect x="56" y="14" width="8" height="8" /><rect x="72" y="14" width="8" height="8" /><rect x="90" y="14" width="8" height="8" />
          <rect x="62" y="28" width="8" height="8" /><rect x="80" y="28" width="8" height="8" /><rect x="96" y="28" width="8" height="8" />
          <rect x="14" y="56" width="8" height="8" /><rect x="28" y="62" width="8" height="8" /><rect x="42" y="56" width="8" height="8" />
          <rect x="56" y="56" width="12" height="12" /><rect x="80" y="56" width="8" height="8" /><rect x="100" y="56" width="8" height="8" />
          <rect x="120" y="62" width="8" height="8" /><rect x="136" y="56" width="10" height="10" />
          <rect x="56" y="80" width="8" height="8" /><rect x="70" y="74" width="12" height="12" /><rect x="94" y="80" width="8" height="8" />
          <rect x="110" y="80" width="8" height="8" /><rect x="128" y="74" width="8" height="8" />
          <rect x="14" y="90" width="8" height="8" /><rect x="32" y="90" width="8" height="8" /><rect x="44" y="82" width="8" height="8" />
          <rect x="56" y="100" width="10" height="10" /><rect x="80" y="102" width="8" height="8" /><rect x="100" y="96" width="8" height="8" />
          <rect x="56" y="120" width="8" height="8" /><rect x="72" y="126" width="8" height="8" /><rect x="90" y="120" width="8" height="8" />
          <rect x="62" y="136" width="8" height="8" /><rect x="80" y="138" width="8" height="8" /><rect x="120" y="120" width="8" height="8" />
          <rect x="136" y="136" width="8" height="8" /><rect x="110" y="138" width="8" height="8" />
        </g>

        <!-- Center UPI Emblem Badge -->
        <rect x="66" y="66" width="28" height="28" rx="6" fill="#0A2A5E" />
        <text x="80" y="84" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#E8A317" text-anchor="middle">UPI</text>
      </g>

      <!-- Supported App Badges (PhonePe, GPay, Paytm) -->
      <g transform="translate(14, 230)">
        <!-- PhonePe Badge -->
        <rect width="84" height="26" rx="6" fill="#5F259F" />
        <circle cx="16" cy="13" r="8" fill="#FFFFFF" />
        <text x="16" y="17" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#5F259F" text-anchor="middle">पे</text>
        <text x="50" y="17" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">PhonePe</text>

        <!-- Google Pay / Paytm Badge -->
        <rect x="92" width="90" height="26" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
        <text x="137" y="17" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#1E293B" text-anchor="middle">GPay &bull; Paytm</text>
      </g>

      <!-- Security Guarantee -->
      <g transform="translate(18, 276)">
        <rect width="174" height="48" rx="8" fill="#F1F5F9" />
        <text x="87" y="20" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">🔒 Bank-Grade 256-bit SSL</text>
        <text x="87" y="36" font-family="'Inter', sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Direct Settlement to School Account</text>
      </g>
    </g>

    <!-- Right Box: Instant Digital Fee Receipt -->
    <g transform="translate(254, 24)">
      <rect width="242" height="342" rx="14" fill="#FFFFFF" stroke="#E2E8F0" />

      <!-- Payment Status Header -->
      <g transform="translate(18, 18)">
        <circle cx="20" cy="20" r="20" fill="#DCFCE7" />
        <text x="20" y="26" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#16A34A" text-anchor="middle">✓</text>
        <text x="48" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#15803D">PAYMENT RECEIVED</text>
        <text x="48" y="34" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#0B1630">₹18,500.00</text>
      </g>

      <line x1="18" y1="74" x2="224" y2="74" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" />

      <!-- Receipt Metadata -->
      <g transform="translate(18, 90)">
        <text x="0" y="10" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748B">STUDENT NAME</text>
        <text x="0" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0B1630">Aanya Agarwal &bull; Class X-B</text>

        <text x="0" y="52" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748B">FEE HEAD</text>
        <text x="0" y="68" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0B1630">Term-2 Tuition &amp; Bus Fee</text>

        <text x="0" y="94" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748B">TRANSACTION ID / UPI REF</text>
        <text x="0" y="110" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#0A2A5E">UPI-948210395721</text>

        <text x="0" y="136" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748B">DATE &amp; TIME</text>
        <text x="0" y="152" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#0B1630">22 Oct 2026, 09:14 AM</text>
      </g>

      <!-- 1-Click PDF Download Button -->
      <g transform="translate(18, 276)">
        <rect width="206" height="42" rx="8" fill="#0A2A5E" />
        <text x="103" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">📥 Download Tax Receipt</text>
      </g>
    </g>
  </g>
</svg>
