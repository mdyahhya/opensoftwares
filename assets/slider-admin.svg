      <text x="352" y="24" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#64748B">ON LEAVE</text>
      <text x="352" y="56" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#D97706">12</text>
      <text x="352" y="74" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#F59E0B">Pre-approved</text>
