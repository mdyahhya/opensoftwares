<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <defs>
    <filter id="cardShadowAdm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0A2A5E" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Card Background: Exact Website Background (#F6F4EF) -->
  <rect width="600" height="600" rx="20" fill="#F6F4EF" />
  <rect x="1" y="1" width="598" height="598" rx="19" stroke="#E5E0D8" stroke-width="1.5" />
  <path d="M0 20 C0 9 9 0 20 0 L580 0 C591 0 600 9 600 20 L600 6 L0 6 Z" fill="#E8A317" />

  <!-- Content Header -->
  <g transform="translate(36, 32)">
    <rect width="175" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE" />
    <circle cx="15" cy="13" r="4" fill="#2563EB" />
    <text x="26" y="17" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#1E40AF" letter-spacing="0.6">SMART ATTENDANCE</text>

    <text x="0" y="60" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="26" fill="#0B1630">Student &amp; Staff Attendance</text>
    <text x="0" y="86" font-family="'Inter', -apple-system, sans-serif" font-weight="400" font-size="13.5" fill="#64748B">Biometric sync, automated WhatsApp alerts &amp; CBSE register</text>
  </g>

  <!-- Interactive Dashboard Mockup Card -->
  <g transform="translate(36, 146)" filter="url(#cardShadowAdm)">
    <rect width="528" height="412" rx="16" fill="#FAF9F6" stroke="#E2E8F0" stroke-width="1.5" />

