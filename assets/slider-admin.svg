    </g>
    <text x="50" y="26" font-family="'Inter', sans-serif" font-size="13.5" font-weight="700" fill="#0B1630">Daily Attendance Overview</text>
    <text x="50" y="42" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#64748B">Today &#8226; Class I to XII &#8226; 42 Sections</text>

    <rect x="408" y="15" width="102" height="24" rx="12" fill="#DCFCE7" />
    <circle cx="420" cy="27" r="3.5" fill="#16A34A" />
    <text x="430" y="31" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#15803D">LIVE SYNCED</text>

