      <rect width="152" height="84" rx="10" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="16" y="24" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#64748B">PRESENT</text>
      <text x="16" y="56" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#059669">1,248</text>
      <text x="16" y="74" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#10B981">96.4% of total</text>

      <!-- Absent Metric -->
      <rect x="168" width="152" height="84" rx="10" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="184" y="24" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#64748B">ABSENT</text>
      <text x="184" y="56" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#DC2626">38</text>
      <text x="184" y="74" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#EF4444">SMS Dispatched</text>

      <!-- On Leave Metric -->
