      <circle cx="26" cy="159" r="14" fill="#F3E8FF" />
      <text x="26" y="163" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#6B21A8" text-anchor="middle">SP</text>
      <text x="50" y="156" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#0B1630">Sneha Patil &#8226; Roll 28</text>
      <text x="50" y="170" font-family="'Inter', sans-serif" font-size="9.5" fill="#64748B">Biometric In: 8:07 AM</text>
      <rect x="404" y="147" width="72" height="24" rx="12" fill="#DCFCE7" />
      <text x="440" y="163" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Present</text>
