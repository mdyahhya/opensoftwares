      <circle cx="26" cy="47" r="14" fill="#EFF6FF" />
      <text x="26" y="51" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#1E40AF" text-anchor="middle">AA</text>
      <text x="50" y="44" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#0B1630">Aanya Agarwal &#8226; Roll 14</text>
      <text x="50" y="58" font-family="'Inter', sans-serif" font-size="9.5" fill="#64748B">Biometric In: 8:02 AM</text>
      <rect x="404" y="35" width="72" height="24" rx="12" fill="#DCFCE7" />
      <text x="440" y="51" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Present</text>

      <!-- Row 2 -->
      <rect y="80" width="488" height="46" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <circle cx="26" cy="103" r="14" fill="#FEF3C7" />
      <text x="26" y="107" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">RK</text>
      <text x="50" y="100" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#0B1630">Rohan Kulkarni &#8226; Roll 22</text>
      <text x="50" y="114" font-family="'Inter', sans-serif" font-size="9.5" fill="#64748B">Absent &#8226; Automated parent SMS sent</text>
      <rect x="404" y="91" width="72" height="24" rx="12" fill="#FEE2E2" />
      <text x="440" y="107" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">Absent</text>

