<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <defs>
    <filter id="shadowBus" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0A2A5E" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean White Card Background -->
  <rect width="600" height="600" rx="24" fill="#FFFFFF" />
  <rect x="1" y="1" width="598" height="598" rx="23" stroke="#E2E8F0" stroke-width="2" />
  <path d="M0 24 C0 10.7 10.7 0 24 0 L576 0 C589.3 0 600 10.7 600 24 L600 6 L0 6 Z" fill="#E8A317" />

  <!-- Header -->
  <g transform="translate(40, 36)">
    <rect width="180" height="28" rx="14" fill="#FEF3C7" stroke="#FDE68A" />
    <circle cx="16" cy="14" r="4" fill="#D97706" />
    <text x="28" y="18" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#B45309" letter-spacing="0.6">GPS LIVE TELEMETRY</text>

    <text x="0" y="66" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#0B1630">Real-Time School Bus Tracking</text>
    <text x="0" y="96" font-family="'Inter', sans-serif" font-weight="400" font-size="14" fill="#64748B">Live map, speed telemetry, geofence pickup alerts &amp; SOS key</text>
  </g>

  <!-- High-Contrast Map Card Mockup -->
  <g transform="translate(40, 160)" filter="url(#shadowBus)">
    <!-- Container -->
    <rect width="520" height="390" rx="18" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Map Elements inside Clip -->
    <g>
      <!-- City Blocks -->
      <rect x="20" y="20" width="110" height="90" rx="8" fill="#E2E8F0" />
      <rect x="160" y="20" width="160" height="90" rx="8" fill="#E2E8F0" />
      <rect x="350" y="20" width="150" height="90" rx="8" fill="#E2E8F0" />

      <!-- City Park (Green) -->
      <rect x="160" y="140" width="160" height="110" rx="10" fill="#DCFCE7" stroke="#BBF7D0" />
      <circle cx="210" cy="180" r="14" fill="#22C55E" opacity="0.3" />
      <circle cx="270" cy="200" r="18" fill="#22C55E" opacity="0.3" />
      <text x="240" y="224" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">Shivaji City Park</text>

      <!-- Water Canal (Blue) -->
      <path d="M 0 310 Q 260 330 520 300" stroke="#BAE6FD" stroke-width="26" fill="none" />
      <text x="90" y="314" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#0284C7">Mula-Mutha River Bypass</text>

      <rect x="20" y="140" width="110" height="130" rx="8" fill="#E2E8F0" />
      <rect x="350" y="140" width="150" height="130" rx="8" fill="#E2E8F0" />

      <!-- Road Grid (Bright White with Borders) -->
      <!-- Horizontal Main Road -->
      <rect x="0" y="110" width="520" height="30" fill="#FFFFFF" />
      <line x1="0" y1="110" x2="520" y2="110" stroke="#CBD5E1" stroke-width="1.5" />
      <line x1="0" y1="140" x2="520" y2="140" stroke="#CBD5E1" stroke-width="1.5" />
      <line x1="0" y1="125" x2="520" y2="125" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="12 8" />

      <!-- Vertical Main Avenue 1 -->
      <rect x="130" y="0" width="30" height="390" fill="#FFFFFF" />
      <line x1="130" y1="0" x2="130" y2="390" stroke="#CBD5E1" stroke-width="1.5" />
      <line x1="160" y1="0" x2="160" y2="390" stroke="#CBD5E1" stroke-width="1.5" />
      <line x1="145" y1="0" x2="145" y2="390" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="12 8" />

      <!-- Vertical Main Avenue 2 -->
      <rect x="320" y="0" width="30" height="390" fill="#FFFFFF" />
      <line x1="320" y1="0" x2="320" y2="390" stroke="#CBD5E1" stroke-width="1.5" />
      <line x1="350" y1="0" x2="350" y2="390" stroke="#CBD5E1" stroke-width="1.5" />

      <!-- Bus Live Route Path (Navy Line) -->
      <path d="M 60 270 L 60 125 L 145 125 L 145 50 L 335 50 L 335 25" stroke="#0A2A5E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Saffron Active Progress Path -->
      <path d="M 60 270 L 60 125 L 145 125 L 145 80" stroke="#E8A317" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Pickup Marker (Green Check) -->
      <circle cx="60" cy="270" r="14" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
      <text x="60" y="275" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">âœ“</text>
      <rect x="82" y="258" width="140" height="24" rx="6" fill="#FFFFFF" stroke="#CBD5E1" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))" />
      <text x="90" y="274" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#059669">Pickup: 7:42 AM (Done)</text>

      <!-- School Destination Marker -->
      <circle cx="335" cy="25" r="16" fill="#0A2A5E" stroke="#FFFFFF" stroke-width="3" />
      <text x="335" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">ðŸ«</text>
      <rect x="360" y="14" width="130" height="24" rx="6" fill="#0A2A5E" />
      <text x="425" y="30" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">School Campus (End)</text>

      <!-- Bus Marker with Radar Pulse at (145, 80) -->
      <circle cx="145" cy="80" r="32" fill="#E8A317" opacity="0.18" />
      <circle cx="145" cy="80" r="22" fill="#E8A317" opacity="0.32" />
      <!-- 3D Bus Shape -->
      <rect x="127" y="62" width="36" height="34" rx="8" fill="#E8A317" stroke="#FFFFFF" stroke-width="2.5" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.25))" />
      <rect x="131" y="66" width="28" height="12" rx="3" fill="#0A2A5E" />
      <circle cx="134" cy="90" r="3.5" fill="#1F2937" />
      <circle cx="156" cy="90" r="3.5" fill="#1F2937" />
      <circle cx="132" cy="84" r="2" fill="#FEF08A" />
      <circle cx="158" cy="84" r="2" fill="#FEF08A" />

      <!-- Bus Speed Pill Tag -->
      <rect x="100" y="36" width="90" height="20" rx="10" fill="#0B1630" />
      <circle cx="112" cy="46" r="3.5" fill="#10B981" />
      <text x="148" y="50" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">BUS 03 &#8226; 38 km/h</text>
    </g>

    <!-- Floating ETA Status Card at Bottom -->
    <g transform="translate(18, 290)">
      <rect width="484" height="84" rx="14" fill="#FFFFFF" stroke="#CBD5E1" filter="drop-shadow(0 10px 20px rgba(10,42,94,0.12))" />
      
      <circle cx="44" cy="42" r="22" fill="#FEF3C7" />
      <text x="44" y="48" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">ðŸšŒ</text>

      <g transform="translate(76, 16)">
        <rect width="80" height="18" rx="4" fill="#DCFCE7" />
        <text x="40" y="13" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#15803D" text-anchor="middle">ON SCHEDULE</text>
        <text x="90" y="14" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#0B1630">7 mins away (1.8 km)</text>
        <text x="0" y="36" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0B1630">Next: Viman Nagar Bus Stop &#8226; 7:55 AM</text>
        <text x="0" y="52" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748B">Driver: Rajesh Shinde &#8226; MH-12-Q-4521</text>
      </g>

      <!-- Quick Call Button -->
      <rect x="424" y="24" width="44" height="44" rx="22" fill="#0A2A5E" />
      <text x="446" y="50" font-family="'Inter', sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">ðŸ“ž</text>
    </g>
  </g>
</svg>
